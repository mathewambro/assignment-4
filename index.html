<!DOCTYPE html>
<!--
    Name: Mathew Ambrosino
    Date: 10.16.2026
    CSC 372-01

    index.html for the TVmaze Gallery. Holds the search form, the status message
    area, the empty gallery that script.js fills with show cards, and the TVmaze credit.
-->

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TVmaze Gallery</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>

<body>
    <header>
        <h1>TVmaze Gallery</h1>
        <p> Search for any tv show by title or keyword.</p>
        <form id="search-form">
            <label for="search-input">Show title or keyword</label>
            <input id="search-input" name="q" type="search" placeholder="e.g. The Office" autocomplete="off">
            <button type="submit">Search</button>
        </form>
    </header>

    <main>
        <p id="status" role="status"></p>
        <div id="gallery"></div>
    </main>

    <footer>
        <p>
            Show data provided by
            <a href="https://www.tvmaze.com/api">TVmaze</a>                     
            under the CC BY-SA license.
        </p>
    </footer>
</body>

</html>
